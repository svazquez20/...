<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot: Verb Tenses & Linking Verbs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        h1 {
            color: #e67e22;
            text-align: center;
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .options {
            margin-bottom: 20px;
        }
        .options label {
            display: block;
            background: #ecf0f1;
            margin: 8px 0;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .options label:hover {
            background: #ffe5b4;
        }
        #feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .correct { background: #d4edda; color: #155724; }
        .incorrect { background: #f8d7da; color: #721c24; }
        #nextBtn {
            background: #e67e22;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
        }
        #nextBtn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        .stats {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Kahoot: Verb Tenses & Linking Verbs</h1>
    <div id="question-box">
        <div class="question" id="question-text">Loading...</div>
        <div class="options" id="options-container"></div>
        <div id="feedback"></div>
        <button id="nextBtn" onclick="nextQuestion()" disabled>Next Question →</button>
    </div>
    <div class="stats">
        Question <span id="current-index">1</span> of <span id="total-questions">0</span>
    </div>
</div>
<script>
const questions = [
    {
        question: "What does the present tense express?",
        options: [
            "Actions happening now",
            "Actions that happened in the past",
            "Actions that will happen in the future",
            "Actions that never happen"
        ],
        correct: 0,
        rationale: "The present tense is used for actions happening in the present moment."
    },
    {
        question: "How can you form the present tense in English?",
        options: [
            "With the verb unadorned or with 'is' + 'ing'",
            "By adding '-ed' to the verb",
            "By starting with 'will'",
            "By using 'have' + past participle"
        ],
        correct: 0,
        rationale: "Present tense: verb alone (I eat) or 'is' + 'ing' (is singing)."
    },
    {
        question: "How do you form the past tense of 'walk'?",
        options: [
            "Add '-ed' to get 'walked'",
            "Add '-ing' to get 'walking'",
            "Add 'will' to get 'will walk'",
            "Add 'have' to get 'have walk'"
        ],
        correct: 0,
        rationale: "Past tense: add '-ed' to the verb."
    },
    {
        question: "What is the most common way to form the future tense in English?",
        options: [
            "Start with 'will'",
            "Add '-ed'",
            "Use 'is' + 'ing'",
            "Use 'have' + past participle"
        ],
        correct: 0,
        rationale: "Future tense: use 'will' (will go, will attend)."
    },
    {
        question: "Which of these is a linking verb?",
        options: [
            "is",
            "run",
            "eat",
            "jump"
        ],
        correct: 0,
        rationale: "'Is' is a linking verb that connects ideas."
    },
    {
        question: "Which sentence uses a linking verb?",
        options: [
            "It is sunny out.",
            "She runs fast.",
            "They will eat pizza.",
            "He walked home."
        ],
        correct: 0,
        rationale: "'Is' connects the subject to a description."
    },
    {
        question: "Which verb is NOT a linking verb?",
        options: [
            "run",
            "be",
            "seems",
            "appears"
        ],
        correct: 0,
        rationale: "'Run' is an action verb, not a linking verb."
    },
    {
        question: "Which tense is used in 'They will go to Kentucky on Thursday'?",
        options: [
            "Future",
            "Present",
            "Past",
            "Present perfect"
        ],
        correct: 0,
        rationale: "'Will go' is future tense."
    }
];
let currentIndex = 0;
let score = 0;
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const feedbackElement = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const currentIndexElement = document.getElementById('current-index');
const totalQuestionsElement = document.getElementById('total-questions');
totalQuestionsElement.textContent = questions.length;
displayQuestion();
function displayQuestion() {
    if (currentIndex >= questions.length) {
        showResults();
        return;
    }
    const q = questions[currentIndex];
    questionText.textContent = q.question;
    optionsContainer.innerHTML = '';
    feedbackElement.innerHTML = '';
    feedbackElement.className = '';
    nextBtn.disabled = true;
    q.options.forEach((opt, idx) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type='radio' name='answer' value='${idx}'> ${opt}`;
        label.onclick = () => checkAnswer(idx);
        optionsContainer.appendChild(label);
    });
    currentIndexElement.textContent = currentIndex + 1;
}
function checkAnswer(selectedIdx) {
    const q = questions[currentIndex];
    nextBtn.disabled = false;
    const labels = optionsContainer.querySelectorAll('label');
    labels.forEach((label, idx) => {
        label.querySelector('input').disabled = true;
        if (idx === q.correct) {
            label.style.background = '#d4edda';
        } else if (idx === selectedIdx) {
            label.style.background = '#f8d7da';
        }
    });
    if (selectedIdx === q.correct) {
        feedbackElement.innerHTML = `Correct! ✅<br><span>${q.rationale}</span>`;
        feedbackElement.className = 'correct';
        score++;
    } else {
        feedbackElement.innerHTML = `Incorrect. ❌<br>Correct answer: <strong>${q.options[q.correct]}</strong><br><span>${q.rationale}</span>`;
        feedbackElement.className = 'incorrect';
    }
}
function nextQuestion() {
    currentIndex++;
    displayQuestion();
}
function showResults() {
    document.getElementById('question-box').innerHTML = `
        <h2>Quiz Finished 🎉</h2>
        <p>Your final score: <strong>${score} of ${questions.length}</strong></p>
        <p>Great job! You practiced verb tenses and linking verbs.</p>
        <button onclick='window.location.reload()'>Play Again</button>
    `;
    document.querySelector('.stats').style.display = 'none';
}
</script>
</body>
</html>
