<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego: Completa la Oración en Alemán</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        #phonetic-hint {
            font-size: 1.2em;
            text-align: center;
            margin: 15px 0;
            color: #2980b9;
        }
        #sentence-box {
            font-size: 1.2em;
            margin-bottom: 15px;
            padding: 10px;
        }
        #answer-input {
            width: 95%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #check-button, #next-button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #check-button {
            background-color: #3498db;
            color: white;
        }
        #next-button {
            background-color: #2ecc71;
            color: white;
            display: none;
        }
        #feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Completa la Oración en Alemán</h1>
    <p>Escribe la palabra que falta en la oración. La pista es la pronunciación en alfabeto fonético internacional (IPA).</p>
    <div id="phonetic-hint"></div>
    <div id="sentence-box"></div>
    <input type="text" id="answer-input" placeholder="Escribe la palabra en alemán...">
    <button id="check-button">Comprobar</button>
    <button id="next-button">Siguiente Oración</button>
    <div id="feedback"></div>
</div>
<script>
    // Vocabulario: ["Español/Contexto", "Respuesta en Alemán", "Frase de Ejemplo", "IPA"]
    const vocabulary = [
        ["regional", "regional", "Außerdem kaufe ich viele ___ Produkte.", "ˈʁeːɡi̯oˌnaːl"],
        ["el producto (-e)", "das Produkt", "Ich kaufe ein ___.", "pʁoˈdʊkt"],
        ["el entorno / alrededores (-en)", "die Umgebung", "Produkte aus der ___.", "ʊmˈɡeːbʊŋ"],
        ["la fábrica (-en)", "die Fabrik", "Das Essen aus ___.", "faˈbʁiːk"],
        ["contra / alrededor de", "gegen", "___ 9 Uhr bin ich in der Kantine.", "ˈɡeːɡn̩"],
        ["planear (ha planeado)", "planen", "Ich ___ die Gerichte für die nächsten Tage.", "ˈplaːnən"],
        ["satisfecho/a", "zufrieden", "Der Gast ist mit dem Essen nicht ___.", "tsuˈfʁiːdən"],
        ["el Schnitzel (-)", "das Schnitzel", "Ich nehme das ___ mit Pommes und Salat.", "ˈʃnɪtsl̩"],
        ["el trozo / pieza (-e)", "das Stück", "Ein Eiskaffee, ein ___ Kuchen und ein Tee...", "ʃtʏk"],
        ["el limón / la lima (-n)", "die Zitrone", "Ein Tee mit ___.", "tsiˈtʁoːnə"],
        ["limpio/a", "sauber", "Das Messer ist nicht ___.", "ˈzaʊbɐ"],
        ["la ternera / la res (-er)", "das Rind", "Ich nehme einen ___braten.", "ʁɪnt"],
        ["ocupado/a (un asiento)", "besetzt", "Der Platz ist ___.", "bəˈzɛtst"],
        ["la propina (-er)", "das Trinkgeld", "Geben Sie ___.", "ˈtʁɪŋkˌɡɛlt"],
        ["la cuchara (-)", "der Löffel", "Wo sind denn die ___?", "ˈlœfl̩"],
        ["el cuchillo (-)", "das Messer", "Oh, mein ___ ist mir gefallen.", "ˈmɛsɐ"],
        ["el plato (-)", "der Teller", "Gibst du mir deinen ___, Tim?", "ˈtɛlɐ"],
        ["el tenedor (-n)", "die Gabel", "Ich brauche eine ___.", "ˈɡaːbl̩"],
        ["la olla / el cazo (-e)", "der Topf", "Wir brauchen einen ___.", "tɔpf"],
        ["la jarra / la tetera (-n)", "die Kanne", "Ich brauche eine ___.", "ˈkanə"],
        ["el cuenco / la fuente (-n)", "die Schüssel", "Ich brauche eine ___.", "ˈʃʏsl̩"],
        ["la sartén (-n)", "die Pfanne", "Ich brauche eine ___.", "ˈpfanə"],
        ["la taza (-n)", "die Tasse", "Acht ___ pro Tag sind es bestimmt.", "ˈtasə"],
        ["el vaso (-er)", "das Glas", "Trinkst du aus meinem ___?", "ɡlaːs"],
        ["la máquina lavaplatos (-n)", "die Spülmaschine", "Ich brauche eine ___.", "ˈʃpyːlmaˌʃiːnə"],
        ["oler", "riechen", "Hm, das ___ so lecker!", "ˈʁiːçən"],
        ["el apetito (Sg.)", "der Appetit", "Guten ___!", "apɛˈtiːt"],
        ["el suelo / piso", "der Boden", "Der ___ ist ziemlich kalt.", "ˈboːdn̩"],
        ["lleno/a / completo/a", "voll", "Mit ___ Mund sprechen.", "fɔl"],
        ["educado/a / cortés", "höflich", "Das ist nicht ___.", "ˈhøːflɪç"],
        ["la dieta (-en)", "die Diät", "Sie machen eine ___.", "diˈɛːt"],
        ["satisfecho/a / lleno/a", "satt", "Sie sind ___, aber Sie dürfen nicht 'Nein' sagen.", "zat"],
        ["sorprender (ha sorprendido)", "überraschen", "Das ___ mich.", "ˌyːbɐˈʁaʃən"],
        ["extraño/a / raro/a", "seltsam", "Das finde ich ___.", "ˈzɛltzaːm"],
        ["exactamente igual", "genauso", "Bei uns ist das ___.", "ɡəˈnaʊzo"],
        ["diferente / de otra manera", "anders", "Bei uns ist das ___.", "ˈandɐs"],
        ["picante", "scharf", "Ich koche sehr gern ___.", "ʃaʁf"],
        ["dulce", "süß", "Ich koche gern ___.", "zyːs"],
        ["salado/a", "salzig", "Ich koche nicht gern ___.", "ˈzaltsɪç"],
        ["graso/a / con mucha grasa", "fett", "Ich koche nicht gern ___.", "fɛt"],
        ["dirigir / gestionar (ha dirigido)", "leiten", "Joachim Vogt ___ die Kantine...", "ˈlaɪtən"],
        ["fresco/a", "frisch", "Frisches Essen ist sehr ___.", "fʁɪʃ"],
        ["redondo/a / aproximadamente", "rund", "Wir haben ___ 500 Mitarbeiter.", "ʁʊnt"],
        ["diferente / diverso/a", "unterschiedlich", "Wir haben ___ Arten von Müsli.", "ˈʊntɐʃiːtlɪç"],
        ["el tipo / la clase (-en)", "die Art", "Viele ___ von Gemüse.", "aʁt"],
        ["la fruta (-e)", "die Frucht", "Joghurt mit ___.", "fʁʊxt"],
        ["el aperitivo / entrante (-n)", "die Vorspeise", "Mittags gibt es ___.", "ˈfoːɐˌʃpaɪzə"],
        ["principal (adj. o parte)", "Haupt-", "Es gibt drei ___gerichte.", "haʊpt"],
        ["el porcentaje (-e)", "das Prozent", "Fast 50 ___ nehmen das Gemüsegericht.", "pʁoˈtsɛnt"],
        ["el mercado (-e)", "der Markt", "Auf dem ___.", "maʁkt"],
        ["además / aparte", "außerdem", "___ kaufe ich viele regionale Produkte...", "ˈaʊsɐdeːm"],
        ["la guarnición / postre (-n)", "die Nachspeise", "Als ___ gibt es Joghurt...", "ˈnaːxˌʃpaɪzə"],
        ["la miel (Sg.)", "der Honig", "Joghurt mit ___ und Nüssen.", "ˈhoːnɪç"],
        ["pocas veces / raramente", "selten", "Ich esse ___ Fleisch.", "ˈzɛltən"],
        ["la comida / el almuerzo (-en)", "die Mahlzeit", "Keine Zeit für eine richtige ___.", "ˈmaːltsaɪt"],
        ["ciertamente / seguro", "bestimmt", "Acht Tassen pro Tag sind es ___.", "bəˈʃtɪmt"],
        ["la cantina (-n)", "die Kantine", "Gehe ich in die ___.", "kanˈtiːnə"],
        ["casi", "fast", "Ich nehme ___ immer das vegetarische Gericht.", "fast"],
        ["vegetariano/a", "vegetarisch", "Mayla isst nur ___.", "veˈɡeːtaˌʁɪʃ"],
        ["la costumbre / el hábito (-en)", "die Gewohnheit", "Ich habe viele ___ übernommen.", "ɡəˈvoːnhaɪt"],
        ["asumir / adoptar (ha asumido)", "übernehmen", "Ich habe viele Gewohnheiten ___.", "ˌyːbɐˈneːmən"],
        ["la mermelada (-n)", "die Marmelade", "Ich esse fast immer ein ___brot.", "maʁməˈlaːdə"],
        ["el cerdo (-e)", "das Schwein", "Ich esse kein ___fleisch.", "ʃvaɪn"],
        ["dos veces", "zweimal", "Ich esse vielleicht ___ pro Monat Fleisch.", "ˈtsvaɪmaːl"],
        ["el alcohol (Sg.)", "der Alkohol", "Ich trinke nie ___.", "ˈalkohoːl"],
    ];

    let currentIndex = 0;
    let score = 0;
    const phoneticHint = document.getElementById('phonetic-hint');
    const sentenceBox = document.getElementById('sentence-box');
    const answerInput = document.getElementById('answer-input');
    const checkButton = document.getElementById('check-button');
    const nextButton = document.getElementById('next-button');
    const feedbackElement = document.getElementById('feedback');

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function displayQuestion() {
        if (currentIndex < vocabulary.length) {
            phoneticHint.textContent = `Pista IPA: /${vocabulary[currentIndex][3]}/`;
            sentenceBox.textContent = vocabulary[currentIndex][2];
            answerInput.value = '';
            feedbackElement.textContent = '';
            feedbackElement.className = '';
            checkButton.style.display = 'inline-block';
            nextButton.style.display = 'none';
            answerInput.focus();
        } else {
            document.querySelector('.container').innerHTML = `
                <h1>Juego Terminado 🎉</h1>
                <p>Tu puntuación final es: <strong>${score} de ${vocabulary.length}</strong>.</p>
                <p>¡Bien hecho!</p>
            `;
        }
    }

    function checkAnswer() {
        const userAnswer = answerInput.value.trim().toLowerCase();
        const correctAnswer = vocabulary[currentIndex][1].toLowerCase();
        if (userAnswer === correctAnswer) {
            feedbackElement.textContent = `¡Correcto! La palabra es: ${vocabulary[currentIndex][1]}.`;
            feedbackElement.className = 'correct';
            score++;
            checkButton.style.display = 'none';
            nextButton.style.display = 'inline-block';
        } else {
            feedbackElement.textContent = `Incorrecto. La respuesta correcta es: ${vocabulary[currentIndex][1]}.`;
            feedbackElement.className = 'incorrect';
            checkButton.style.display = 'none';
            nextButton.style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentIndex++;
        displayQuestion();
    }

    checkButton.addEventListener('click', checkAnswer);
    nextButton.addEventListener('click', nextQuestion);
    answerInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (checkButton.style.display !== 'none') {
                checkAnswer();
            } else if (nextButton.style.display !== 'none') {
                nextQuestion();
            }
        }
    });
    shuffleArray(vocabulary);
    displayQuestion();
</script>
</body>
</html>
